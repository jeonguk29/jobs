name: 채용공고 수집

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST
  push:
    paths: ["docs/sources/**"]   # 맥에서 원티드 수집본을 올리면 바로 합친다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        run: python scraper/scrape.py

      - name: 커밋
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add docs/jobs.json docs/logos
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 채용공고 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main && git push
          fi
